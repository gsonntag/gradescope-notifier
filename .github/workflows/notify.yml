name: Deadline notifier

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (GitHub may run it a bit late)
  workflow_dispatch:          # lets you click "Run workflow" manually

permissions:
  contents: read

concurrency:
  group: notifier
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # sent.json (which reminders already went out) lives in the Actions cache,
      # not in git. Cache keys are immutable, so each run saves a new entry and
      # the next run restores the most recent one via the prefix.
      - name: Restore sent notifications
        uses: actions/cache/restore@v4
        with:
          path: sent.json
          key: sent-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: sent-

      - run: python notify.py
        env:
          GS_EMAIL: ${{ secrets.GS_EMAIL }}
          GS_PASSWORD: ${{ secrets.GS_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CANVAS_ICS_URL: ${{ secrets.CANVAS_ICS_URL }}
          NOTIFY_HOURS: ${{ vars.NOTIFY_HOURS }}
          TIMEZONE: ${{ vars.TIMEZONE }}
          COURSE_NICKNAMES: ${{ vars.COURSE_NICKNAMES }}

      # Save even if one source failed, so the other's reminders aren't resent.
      - name: Save sent notifications
        if: always() && hashFiles('sent.json') != ''
        uses: actions/cache/save@v4
        with:
          path: sent.json
          key: sent-${{ github.run_id }}-${{ github.run_attempt }}
